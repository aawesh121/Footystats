<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Soccer Player Analyzer{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('home') }}">&#9917; Soccer Player Analyzer</a>
      <form class="d-flex" action="{{ url_for('search') }}" method="get">
        <input class="form-control me-2" name="q" placeholder="Search player" value="{{ request.args.get('q', '') }}">
        <button class="btn btn-success">Search</button>
      </form>
    </div>
  </nav>
  <main class="container">
    {% if not_found %}
      <h2>Not found</h2><p>That page or player doesn't exist.</p>
    {% else %}
      {% block content %}{% endblock %}
    {% endif %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
